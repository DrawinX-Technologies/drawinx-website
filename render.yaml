services:
  - type: web
    name: drawinx-website
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: drawinx-db
          property: connectionString
      - key: CONTACT_EMAIL
        sync: false

databases:
  - name: drawinx-db
    databaseName: drawinx
    user: drawinx
